name: squadup-compose-dev

services:
  postgres:
    image: postgres:15
    container_name: squadup-postgres
    restart: unless-stopped
    profiles:
      - development
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 5

  # S3-compatible object storage. RustFS replaced MinIO, whose free images are
  # gone upstream. The API still talks to it with the `minio` SDK and its
  # MINIO_* settings; only the server changed. Console:
  # http://localhost:9001/rustfs/console/ (the bare `/` answers 403).
  rustfs:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    container_name: squadup-rustfs
    restart: unless-stopped
    profiles:
      - development
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      # Lets the browser use presigned URLs (uploads go straight to storage).
      RUSTFS_CORS_ALLOWED_ORIGINS: ${CLIENT_URL},${OPS_URL}
      # The image otherwise logs to files inside the container.
      RUSTFS_OBS_LOG_DIRECTORY: ''
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    # A named volume, not a bind mount: Docker seeds it with the image's /data,
    # owned by the image's non-root user. A bind-mount folder Docker creates is
    # root-owned, and RustFS then dies with "Permission denied (os error 13)".
    volumes:
      - rustfs_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-fsS',
          '-o',
          '/dev/null',
          'http://localhost:9000/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: squadup-redis
    profiles:
      - development
    ports:
      - '${REDIS_PORT:-6379}:6379'
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USERNAME=${REDIS_USERNAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # --- BACKUP SERVICE ---
  # backup-worker:
  #   container_name: squadup-backup-worker
  #   build:
  #     context: .
  #     dockerfile: ./docker/workers/backup-worker/Dockerfile
  #   profiles:
