  #     - POSTGRES_HOST=postgres
  #     # Pass through DB credentials (ensure these are in .env.local)
  #     - POSTGRES_USER=${POSTGRES_USER}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  #     - POSTGRES_DB=${POSTGRES_DB}
  #     # Pass through Spaces/AWS credentials (ensure these are in .env.local)

  #     - AWS_DEFAULT_REGION=${S3_REGION} # Adjust to match your .env var name
  #     - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID} # Adjust to match your .env var name
  #     - AWS_SECRET_ACCESS_KEY=${S3_SPACES_SECRET} # Adjust to match your .env var name
  #     - SPACES_BUCKET=${S3_BACKUP_BUCKET}
  #     - SPACES_ENDPOINT=${S3_ENDPOINT}
  #     - S3_RETENTION_DAYS=${S3_RETENTION_DAYS}
  #   volumes:
  #     # 1. MOUNT RUSTFS DATA (Read-Only) - Critical for file backup
  #     - rustfs_data:/data_to_backup
  #     # 2. Local storage for logs/temp backups (Optional)
  #     - ./backup_data:/backups
  #   depends_on:
  #     rustfs:
  #       condition: service_started
  #     # postgres:
  #     #   condition: service_healthy
  #   networks:
  #     - mailnet

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: squadup-rabbitmq
    profiles:
      - development
    ports:
      - '${RABBITMQ_AMQP_PORT:-5672}:5672' # AMQP port
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672' # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_DEFAULT_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: squadup-mongodb
    profiles:
      - development
    ports:
      - '${MONGO_PORT:-27017}:27017'
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  rabbitmq_logs:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  rustfs_data:
    driver: local
