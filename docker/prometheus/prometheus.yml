global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'squadup-server'
    static_configs:
      # Use the compose SERVICE name (not container_name) so this resolves
      # regardless of what the container is called.
      - targets: ['server:8080']
        labels:
          group: 'backend'
    metrics_path: '/api/v1/metrics'
    scrape_timeout: 5s
