name: Feature
description: New user-facing behaviour
title: 'feat(<scope>): <the outcome, in imperative mood>'
labels: ['type: feature']
body:
  - type: markdown
    attributes:
      value: |
        Name the outcome: `feat(web): sign in with a passkey`.
        Scopes are listed in CONTRIBUTING.md §1. Add the matching `area:` label.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the problem, and what it costs them today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: What changes for that person when this ships.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: The issue is done when every box is ticked.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Endpoints, designs, ROADMAP.md section, open questions.
