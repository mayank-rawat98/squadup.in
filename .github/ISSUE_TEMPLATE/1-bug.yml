name: Bug
description: Something behaves wrongly
title: 'fix(<scope>): <the symptom a user sees>'
labels: ['type: bug']
body:
  - type: markdown
    attributes:
      value: |
        Name the symptom, not the suspected cause: `fix(web): sign-in button does nothing on Safari`.
        Scopes are listed in CONTRIBUTING.md §1. Add the matching `area:` label.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production (squadup.in)
        - Local
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or browser details
      render: text
