name: CI

# Runs as the first job of every production deploy: `deploy.prod.yml` calls
# this on a push to main (a merged dev → main PR) and builds nothing until it
# passes. A red CI stops the deploy instead of reporting on a site already live.
#
# It no longer runs on pull requests or on pushes to dev. The standing
# dev → main PR is re-synchronised by every merge into dev, so a PR trigger ran
# the full suite again and again for one release. A break on dev is caught when
# dev is promoted, before it deploys. The pre-push hook (`npm run
# check:affected`) is the check that runs as work lands.
#
# `workflow_dispatch` is for running it by hand on any branch, before a
# release, without deploying.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# Keyed on the commit, and never cancelled: this is part of a deploy, and
# deploy.prod.yml already queues deploys one at a time. Cancelling a queued
# release's check would fail that deploy rather than skip it.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  main:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npx nx run-many -t lint test build typecheck
