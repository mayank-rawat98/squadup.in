name: CI

on:
  push:
    branches:
      - dev
  # Pull requests into main (dev → main) must pass before they can merge; the
  # "protect main" ruleset requires the `ci` check. PRs into dev run it too, so
  # contributors see failures before review.
  pull_request:
    branches:
      - main
      - dev

permissions:
  actions: read
  contents: read

# A newer push to the same branch or PR makes the running check obsolete.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main:
    # The status check name the ruleset requires.
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Cache node_modules
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      # - run: npx nx record -- echo Hello World
      - run: npx nx run-many -t lint test build typecheck